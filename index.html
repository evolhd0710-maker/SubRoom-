<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가사방</title>
<meta name="description" content="유튜브 MR에 노래방처럼 가사 타이밍을 맞추고 공유하는 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 노래방 화면처럼 짙은 남색 무대 위에 흰 가사가 하늘색으로 칠해지는 구조. 앱 화면은 같은 무대색 위의 패널. */
:root{
  --stage:#0b1238; --panel:#121a4a; --panel-2:#1a2460; --line:#2a3577;
  --ink:#eef1ff; --dim:#8f98cf; --wipe:#3fd9ff; --accent:#ff4d94; --ok:#5ee6a8; --warn:#ffc857;
  --outline:#050a26;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--stage);color:var(--ink);font:15px/1.6 var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.12em;color:var(--wipe);font-weight:700}
.lead{color:var(--dim);margin:10px 0 0;max-width:58ch}
.hint{font-size:13px;color:var(--dim);margin:0}
.hint.err{color:var(--warn)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--stage);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;min-width:0}
.brand-mark{font-family:var(--f-display);font-size:24px;color:var(--wipe);-webkit-text-stroke:.04em var(--outline);paint-order:stroke fill}
.brand-sub{font-size:12px;color:var(--dim);white-space:nowrap}
nav{display:flex;gap:6px;align-items:center}
nav a:not(.btn){text-decoration:none;color:var(--dim);font-size:14px;padding:6px 8px}
@media (max-width:480px){.brand-sub{display:none}}

.modebar{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--stage));border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:500 14px/1 var(--f-body);
  padding:10px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--wipe);outline-offset:2px}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-wipe{background:var(--wipe);border-color:var(--wipe);color:#04122e}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 10px;font-size:13px}
.btn.danger{color:#ff8fa3}
.btn[disabled]{opacity:.45;cursor:not-allowed}

main{max-width:1180px;margin:0 auto;padding-block:28px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

input,textarea,select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:15px/1.5 var(--f-body)}
textarea{resize:vertical}
select{width:auto;padding:6px 8px;font-size:13px}
label{display:grid;gap:6px;font-size:13px;color:var(--dim)}
.inline{display:flex;gap:8px}
.inline input{min-width:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--stage);
  padding:10px 18px;border-radius:999px;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center}

/* 대시보드 */
.dash-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{width:min(260px,100%)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);padding:10px 14px;font:500 13px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{position:relative;display:block;aspect-ratio:16/9;max-width:100%;background:#000 center/cover no-repeat}
.songno{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:13px;background:rgba(5,10,38,.85);color:var(--warn);padding:2px 8px;border-radius:4px;letter-spacing:.08em}
.linecount{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:12px;background:rgba(5,10,38,.85);color:var(--ink);padding:2px 8px;border-radius:4px}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card-title{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.card-meta{color:var(--dim);font-size:13px;overflow-wrap:anywhere}
.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:44px 20px;text-align:center;color:var(--dim);display:grid;gap:12px;justify-items:center}
.empty strong{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.howto div{display:grid;gap:4px}
.howto b{font-size:14px}
.howto span{font-size:13px;color:var(--dim)}
.howto .step{font-family:var(--f-mono);color:var(--wipe);font-size:12px}

/* 편집기 */
.ed-head{margin-bottom:16px}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--warn);margin:0 0 16px}
.ed{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
.ed-left{position:sticky;top:72px;display:grid;gap:10px}
@media (max-width:860px){.ed{grid-template-columns:1fr}.ed-left{position:static}}
.player-box{aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.player-box iframe{width:100%;height:100%;display:block;border:0}
.player-empty{display:grid;place-items:center;height:100%;color:var(--dim);font-size:14px;text-align:center;padding:16px}
.transport{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rate{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:10px 12px;font:500 14px var(--f-body);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--wipe)}
.tabs .n{font-family:var(--f-mono);font-size:12px;margin-right:6px;color:var(--wipe)}
.stack{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
details{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
details[open]{display:grid;gap:10px}
summary{cursor:pointer;font-size:13px;color:var(--dim)}
.sync-pad{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.tap{font-family:var(--f-display);font-size:20px;padding:18px 12px;border-radius:12px;background:var(--accent);color:#fff;border:0;cursor:pointer;touch-action:manipulation}
.tap:active{transform:scale(.98)}
.sync-pad .btn{border-radius:12px;touch-action:manipulation}
.kbd{font-family:var(--f-mono);font-size:11px;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:1px 4px;margin-left:6px}
@media (hover:none){.kbd{display:none}}
.lines{list-style:none;margin:0;padding:4px 0;max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ln{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;padding:6px 10px;border-left:3px solid transparent}
.ln .tm{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--wipe);background:none;border:0;cursor:pointer;padding:4px;border-radius:4px}
.ln .tm:hover{background:var(--panel-2)}
.ln .tm.none{color:var(--dim)}
.nudge{display:flex;gap:2px}
.nudge button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font:500 14px/1 var(--f-mono)}
.nudge button:hover{color:var(--ink);border-color:var(--dim)}
.ln .tx{cursor:pointer;overflow-wrap:anywhere;line-height:1.45}
.endtag{display:inline-block;margin-left:8px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.ln.cursor{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ln.live .tx{color:var(--wipe);font-weight:700}
.ln.bad .tm{color:var(--warn)}
.lines .pad{padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.bar>div{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin-top:12px}
.confirm span{flex:1;min-width:180px;font-size:14px}

/* 부르기 화면 */
body.playing header.top,body.playing .modebar{display:none}
body.playing main{max-width:none;padding:0}
.play{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.play-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.play-title{flex:1;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.play-title .mono{color:var(--warn);margin-right:6px;font-weight:500}
.offset{display:flex;align-items:center;gap:6px}
.offset .mono{min-width:5.5ch;text-align:center;font-size:13px}
.play-video{width:min(calc(100% - 32px),440px);aspect-ratio:16/9;margin:12px auto 0;border-radius:8px;overflow:hidden;background:#000;flex:none}
.play-video.small{width:240px}
.play-video iframe{width:100%;height:100%;display:block;border:0}
.stage{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,5vh,48px);min-height:300px;overflow:hidden;
  padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--wipe) 7%,transparent) 50%,transparent 100%)}
.slot{font-family:var(--f-display);font-size:clamp(28px,7vw,92px);line-height:1.25;white-space:nowrap;min-height:1.25em;overflow:hidden}
.slot.upper{text-align:left;padding-right:6%}
.slot.lower{text-align:right;padding-left:6%}
.lyr{position:relative;display:inline-block}
.lyr .base{-webkit-text-stroke:.08em var(--outline);paint-order:stroke fill;white-space:nowrap}
.lyr .base{color:#fff}
.overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:24px;pointer-events:none}
.overlay.interact{pointer-events:auto}
.tc-no{font-family:var(--f-mono);color:var(--warn);letter-spacing:.2em;font-size:clamp(14px,2vw,20px)}
.tc-title{font-family:var(--f-display);font-size:clamp(34px,8vw,92px);line-height:1.1;text-wrap:balance;-webkit-text-stroke:.05em var(--outline);paint-order:stroke fill}
.tc-artist{font-size:clamp(16px,3vw,28px);color:var(--ink)}
.tc-by{font-size:13px;color:var(--dim)}
.tc-hint{margin-top:14px;font-size:14px;color:var(--wipe)}
.interlude{font-family:var(--f-display);font-size:clamp(24px,5vw,48px);color:var(--dim);letter-spacing:.3em}
.dots{position:absolute;left:0;right:0;top:14%;display:flex;gap:18px;justify-content:center}
.dots i{width:clamp(12px,2.2vw,22px);aspect-ratio:1;border-radius:50%;background:var(--warn);transition:opacity .15s}
.dots i.off{opacity:.12}
.end-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="brand-mark">가사방</span><span class="brand-sub">블루투스 MR용 노래방 가사</span></a>
  <nav><a href="#/">대시보드</a><a href="#/new" class="btn btn-accent btn-sm">새 자막 만들기</a></nav>
</header>
<div id="modeBar" class="modebar" hidden></div>
<main id="view"></main>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================
   설정: Supabase를 연결하면 공유 대시보드가 켜집니다 (README 참고).
   비워두면 이 기기(브라우저)에만 저장되는 로컬 모드로 동작합니다.
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: ''
};

/* ---------- 공통 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const round2 = t => t == null ? null : Math.round(t * 100) / 100;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isYtId = id => typeof id === 'string' && /^[\w-]{11}$/.test(id);

function fmt(t) {
  if (t == null) return '--:--.--';
  const cs = Math.round(Math.max(0, t) * 100);
  const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
}
function songNo(id) { let h = 7; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return String(10000 + h % 90000); }
function relDate(iso) {
  if (!iso) return '';
  const d = new Date(iso), days = Math.floor((Date.now() - d) / 86400000);
  if (days <= 0) return '오늘'; if (days === 1) return '어제'; if (days < 30) return `${days}일 전`;
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2400); }
function errorBox(e) { return `<div class="empty"><strong>문제가 생겼어요</strong><span>${esc(e && e.message || e)}</span><a class="btn" href="#/">대시보드로</a></div>`; }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('링크를 복사했어요'); }
  catch { window.prompt && window.prompt('아래 링크를 복사하세요', text); }
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = name.replace(/[\\/:*?"<>|]/g, '_'); document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 유튜브 링크 해석 ---------- */
function parseYouTubeId(input) {
  const s = String(input || '').trim();
  if (isYtId(s)) return s;
  try {
    const u = new URL(/^https?:\/\//.test(s) ? s : 'https://' + s);
    const h = u.hostname.replace(/^(www|m|music)\./, '');
    if (h === 'youtu.be') { const id = u.pathname.slice(1, 12); return isYtId(id) ? id : null; }
    if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
      const v = u.searchParams.get('v'); if (isYtId(v)) return v;
      const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/); if (m) return m[2];
    }
  } catch {}
  return null;
}

/* ---------- 가사 데이터 형식 ----------
   song = { id, youtube_id, title, artist, author, lines:[{t, e, text}], plays, created_at, updated_at }
   t = 줄 시작(초), e = 줄 끝(초, 없으면 다음 줄 시작으로 계산)  */
function endOf(L, i) {
  const l = L[i];
  if (l.e != null && l.e > l.t) return l.e;
  const est = clamp(l.text.length * 0.42, 2, 9);
  const n = L[i + 1];
  if (n && n.t != null && n.t > l.t) return (n.t - l.t > est * 2) ? l.t + est * 1.5 : n.t;
  return l.t + est;
}
function toLRC(song) {
  const out = [`[ti:${song.title || ''}]`, `[ar:${song.artist || ''}]`, `[by:${song.author || ''}]`];
  const L = song.lines;
  L.forEach((l, i) => {
    if (l.t == null) return;
    out.push(`[${fmt(l.t)}]${l.text}`);
    const n = L[i + 1];
    if (l.e != null && (!n || n.t == null || n.t - l.e > 0.05)) out.push(`[${fmt(l.e)}]`);
  });
  return out.join('\n') + '\n';
}
function fromLRC(text) {
  const meta = {}, items = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const mm = raw.match(/^\[(ti|ar|by):(.*)\]\s*$/i);
    if (mm) { meta[mm[1].toLowerCase()] = mm[2].trim(); continue; }
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!tags.length) continue;
    const body = raw.slice(tags[tags.length - 1].index + tags[tags.length - 1][0].length).trim();
    for (const t of tags) items.push({ t: round2(+t[1] * 60 + +t[2]), text: body });
  }
  items.sort((a, b) => a.t - b.t);
  const lines = [];
  for (const it of items) {
    if (!it.text) { if (lines.length) lines[lines.length - 1].e = it.t; continue; }
    lines.push({ t: it.t, e: null, text: it.text });
  }
  return { meta, lines };
}

/* ---------- 저장소: 로컬 / Supabase ---------- */
const sb = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase)

const LocalStore = {
  all() { return ls.get('gb.songs', []); },
  async list({ q = '', sort = 'recent' } = {}) {
    let a = this.all();
    const k = q.trim().toLowerCase();
    if (k) a = a.filter(s => `${s.title} ${s.artist}`.toLowerCase().includes(k));
    a.sort(sort === 'popular' ? (x, y) => (y.plays || 0) - (x.plays || 0) : (x, y) => String(y.created_at).localeCompare(String(x.created_at)));
    return a;
  },
  async get(id) { const s = this.all().find(s => s.id === id); if (!s) throw new Error('곡을 찾을 수 없어요. 다른 기기에서 만든 곡이라면 공유 서버 연결이 필요해요.'); return s; },
  async save(song) {
    const a = this.all(), now = new Date().toISOString();
    const rec = { ...song, updated_at: now };
    if (!rec.id) { rec.id = uuid(); rec.created_at = now; rec.plays = 0; }
    const i = a.findIndex(s => s.id === rec.id);
    if (i >= 0) a[i] = { ...a[i], ...rec }; else a.push(rec);
    if (!ls.set('gb.songs', a)) throw new Error('브라우저 저장 공간에 쓸 수 없어요. 시크릿 모드라면 일반 창에서 열어주세요.');
    return rec.id;
  },
  async remove(id) { ls.set('gb.songs', this.all().filter(s => s.id !== id)); },
  async bump(id) { const a = this.all(), s = a.find(s => s.id === id); if (s) { s.plays = (s.plays || 0) + 1; ls.set('gb.songs', a); } }
};

const COLS = 'id,youtube_id,title,artist,author,lines,plays,created_at,updated_at';
const RemoteStore = {
  async list({ q = '', sort = 'recent' } = {}) {
    let qb = sb.from('songs').select(COLS).order(sort === 'popular' ? 'plays' : 'created_at', { ascending: false }).limit(60);
    const k = q.replace(/[%,()*\\]/g, ' ').trim();
    if (k) qb = qb.or(`title.ilike.%${k}%,artist.ilike.%${k}%`);
    const { data, error } = await qb; if (error) throw error; return data || [];
  },
  async get(id) {
    const { data, error } = await sb.from('songs').select(COLS).eq('id', id).maybeSingle();
    if (error) throw error; if (!data) throw new Error('곡을 찾을 수 없어요. 삭제되었을 수 있어요.'); return data;
  },
  async save(song) {
    const p = { youtube_id: song.youtube_id, title: song.title, artist: song.artist, author: song.author, lines: song.lines };
    if (song.id) {
      const { data, error } = await sb.rpc('update_song', { p_id: song.id, p_token: tokens.get(song.id), p_song: p });
      if (error) throw error; if (!data) throw new Error('이 곡을 수정할 권한이 없어요. 만든 기기에서만 수정할 수 있어요.');
      return song.id;
    }
    const id = uuid(), tok = uuid();
    const { error } = await sb.from('songs').insert({ id, ...p, owner_token: tok });
    if (error) throw error; tokens.set(id, tok); return id;
  },
  async remove(id) {
    const { data, error } = await sb.rpc('delete_song', { p_id: id, p_token: tokens.get(id) });
    if (error) throw error; if (!data) throw new Error('이 곡을 삭제할 권한이 없어요.'); tokens.del(id);
  },
  async bump(id) { try { await sb.rpc('bump_play', { p_id: id }); } catch {} }
};
const Store = sb ? RemoteStore : LocalStore;

/* ---------- 유튜브 플레이어 ---------- */
let ytPromise = null;
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytPromise) return ytPromise;
  ytPromise = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { ytPromise = null; rej(new Error('유튜브 플레이어를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(s);
  });
  return ytPromise;
}
async function createPlayer(el, videoId, { onState, onError } = {}) {
  await loadYT();
  return new Promise(res => {
    new YT.Player(el, {
      width: '100%', height: '100%', videoId,
      playerVars: Object.assign({ playsinline: 1, rel: 0, modestbranding: 1 }, /^https?:$/.test(location.protocol) ? { origin: location.origin } : {}),
      events: { onReady: e => res(e.target), onStateChange: e => onState && onState(e.data), onError: e => onError && onError(e.data) }
    });
  });
}

/* getCurrentTime은 거칠게 갱신되므로 프레임 사이를 보간 */
class Clock {
  constructor(p) { this.p = p; this.raw = -1; this.base = 0; this.at = 0; this.last = 0; }
  now() {
    const p = this.p; if (!p || !p.getCurrentTime) return 0;
    const raw = p.getCurrentTime() || 0, t = performance.now();
    if (raw !== this.raw) { this.raw = raw; this.base = raw; this.at = t; }
    let v = raw;
    if (p.getPlayerState && p.getPlayerState() === 1) {
      v = this.base + (t - this.at) / 1000 * (p.getPlaybackRate ? p.getPlaybackRate() : 1);
      if (v < this.last && this.last - v < 0.3) v = this.last;
    }
    this.last = v; return v;
  }
}

/* ---------- 화면 수명주기 ---------- */
let cleanups = [];
const onCleanup = f => cleanups.push(f);
function runCleanup() { while (cleanups.length) { try { cleanups.pop()(); } catch {} } }
function loop(fn) { let id; const tick = () => { fn(); id = requestAnimationFrame(tick); }; id = requestAnimationFrame(tick); onCleanup(() => cancelAnimationFrame(id)); }
function listen(target, type, fn, opt) { target.addEventListener(type, fn, opt); onCleanup(() => target.removeEventListener(type, fn, opt)); }

async function route() {
  runCleanup();
  document.body.classList.remove('playing');
  const [, a, b] = (location.hash.replace(/^#/, '') || '/').split('/');
  window.scrollTo(0, 0);
  try {
    if (a === 'new') await viewEditor(null);
    else if (a === 'edit' && b) await viewEditor(b);
    else if (a === 'play' && b) await viewPlay(b);
    else await viewDash();
  } catch (e) { console.error(e); view.innerHTML = errorBox(e); }
}

  /* 2단계 */
  $('#applyLyr').addEventListener('click', () => {
    const texts = $('#lyr').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!texts.length) { saveMsg.textContent = '가사를 한 줄 이상 넣어주세요.'; return; }
    const old = L();
    ed.song.lines = texts.map((text, i) => ({ t: old[i] ? old[i].t : null, e: old[i] ? old[i].e : null, text }));
    ed.cursor = firstUntimed(L()); saveMsg.textContent = ''; touch(); setTab('sync');
  });
  $('#lrcApply').addEventListener('click', () => {
    const { meta, lines } = fromLRC($('#lrcIn').value);
    if (!lines.length) { saveMsg.textContent = 'LRC에서 [분:초] 형식의 줄을 찾지 못했어요.'; return; }
    ed.song.lines = lines;
    if (!ed.song.title && meta.ti) { ed.song.title = meta.ti; $('#title').value = meta.ti; setHeading(); }
    if (!ed.song.artist && meta.ar) { ed.song.artist = meta.ar; $('#artist').value = meta.ar; }
    $('#lyr').value = lines.map(l => l.text).join('\n');
    ed.cursor = firstUntimed(lines); touch(); setTab('sync'); toast(`LRC ${lines.length}줄을 가져왔어요`);
  });

  /* 3단계: 싱크 */
  function updateHint() {
    const h = $('#syncHint'), n = L().length;
    if (!ed.player) h.textContent = '먼저 1단계에서 유튜브 영상을 불러오세요.';
    else if (!n) h.textContent = '2단계에서 가사를 먼저 넣어주세요.';
    else if (ed.cursor < n) h.innerHTML = `다음 <b>${ed.cursor + 1}번 줄</b> “${esc(L()[ed.cursor].text)}” 이 시작되는 순간 탭하세요.`;
    else h.textContent = `${n}줄 모두 싱크했어요. 시간 옆 −/+ 로 0.1초씩 다듬을 수 있어요.`;
  }
  function renderLines() {
    const arr = L();
    $('#lines').innerHTML = arr.length ? arr.map((l, i) => {
      const bad = l.t != null && i > 0 && arr[i - 1].t != null && l.t < arr[i - 1].t;
      return `<li class="ln${i === ed.cursor ? ' cursor' : ''}${bad ? ' bad' : ''}${i === ed.live ? ' live' : ''}" data-i="${i}">
        <button type="button" class="tm${l.t == null ? ' none' : ''}" data-act="seek" title="이 줄 2초 전부터 재생">${fmt(l.t)}</button>
        <span class="nudge"><button type="button" data-act="minus" aria-label="0.1초 앞당기기">−</button><button type="button" data-act="plus" aria-label="0.1초 늦추기">+</button></span>
        <span class="tx" data-act="from">${esc(l.text)}${l.e != null ? `<span class="endtag">끝 ${fmt(l.e)}</span>` : ''}</span></li>`;
    }).join('') : '<li class="hint pad">2단계에서 가사를 먼저 넣어주세요.</li>';
    updateHint();
  }
  function scrollCursor() { const el = $(`#lines .ln[data-i="${ed.cursor}"]`) || $(`#lines .ln[data-i="${ed.cursor - 1}"]`); el && el.scrollIntoView({ block: 'nearest' }); }

  function tap() {
    if (!ed.player || !L().length) { updateHint(); return; }
    if (!playing()) { ed.player.playVideo(); toast('재생을 시작했어요. 소절이 시작될 때 탭하세요'); return; }
    if (ed.cursor >= L().length) { toast('모든 줄을 싱크했어요'); return; }
    const t = round2(now()), arr = L();
    arr[ed.cursor].t = t;
    if (ed.cursor > 0 && arr[ed.cursor - 1].e != null && arr[ed.cursor - 1].e > t) arr[ed.cursor - 1].e = null;
    ed.cursor++; touch(); renderLines(); scrollCursor();
  }
  function markEnd() {
    const i = ed.cursor - 1; if (i < 0 || !ed.player) return;
    const t = round2(now()); if (t <= L()[i].t) return;
    L()[i].e = t; touch(); renderLines(); toast(`${i + 1}번 줄 끝 ${fmt(t)}`);
  }
  function undo() {
    if (ed.cursor <= 0) return;
    ed.cursor--; L()[ed.cursor].t = null; L()[ed.cursor].e = null; touch(); renderLines(); scrollCursor();
  }
  $('#tap').addEventListener('click', e => { e.currentTarget.blur(); tap(); });
  $('#mend').addEventListener('click', e => { e.currentTarget.blur(); markEnd(); });
  $('#undo').addEventListener('click', e => { e.currentTarget.blur(); undo(); });
  $('#lines').addEventListener('click', e => {
    const act = e.target.closest('[data-act]'); if (!act) return;
    const li = act.closest('.ln'), i = +li.dataset.i, l = L()[i];
    if (act.dataset.act === 'seek') { if (l.t != null) seek(l.t - 2); }
    else if (act.dataset.act === 'minus' || act.dataset.act === 'plus') {
      if (l.t == null) return; l.t = round2(Math.max(0, l.t + (act.dataset.act === 'plus' ? 0.1 : -0.1))); touch(); renderLines();
    } else if (act.dataset.act === 'from') {
      ed.cursor = i; const prev = i > 0 ? L()[i - 1].t : 0; seek((prev ?? 0) - 1); renderLines();
    }
  });
  const shiftAll = d => { L().forEach(l => { if (l.t != null) l.t = round2(Math.max(0, l.t + d)); if (l.e != null) l.e = round2(Math.max(0, l.e + d)); }); touch(); renderLines(); };
  $('#shiftM').addEventListener('click', () => shiftAll(-0.1));
  $('#shiftP').addEventListener('click', () => shiftAll(0.1));
  let resetArmed = false;
  $('#resetSync').addEventListener('click', e => {
    if (!resetArmed) { resetArmed = true; e.currentTarget.textContent = '한 번 더 누르면 지워져요'; setTimeout(() => { resetArmed = false; const b = $('#resetSync'); if (b) b.textContent = '타이밍 모두 지우기'; }, 3000); return; }
    L().forEach(l => { l.t = null; l.e = null; }); ed.cursor = 0; resetArmed = false; e.currentTarget.textContent = '타이밍 모두 지우기'; touch(); renderLines();
  });

  const typing = t => t && t.closest && t.closest('input,textarea,select,[contenteditable]');
  listen(document, 'keydown', e => {
    if (ed.tab !== 'sync' || typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) tap(); }
    else if (e.key === 'Enter') { e.preventDefault(); markEnd(); }
    else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(now() - 3); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(now() + 3); }
  });
  listen(document, 'keyup', e => { if (ed.tab === 'sync' && !typing(e.target) && e.code === 'Space') e.preventDefault(); });

  /* 재생 위치 표시 + 현재 줄 강조 */
  loop(() => {
    if (!ed.clock) return;
    const t = now();
    $('#clock').textContent = fmt(t);
    if (ed.tab !== 'sync') return;
    const arr = L(); let live = -1;
    for (let i = 0; i < arr.length; i++) { if (arr[i].t == null) break; if (arr[i].t <= t && t < endOf(arr, i)) live = i; }
    if (live !== ed.live) {
      const prev = $(`#lines .ln[data-i="${ed.live}"]`); prev && prev.classList.remove('live');
      ed.live = live;
      const cur = $(`#lines .ln[data-i="${live}"]`); cur && cur.classList.add('live');
    }
  });

  /* 저장 / 삭제 / 내보내기 */
  function validate() {
    const s = ed.song;
    if (!isYtId(s.youtube_id)) { setTab('info'); return '유튜브 MR 링크를 먼저 불러와 주세요.'; }
    if (!s.title.trim()) { setTab('info'); $('#title').focus(); return '곡 제목을 입력해 주세요.'; }
    if (!s.lines.length) { setTab('lyrics'); return '가사를 넣고 적용해 주세요.'; }
    const n = s.lines.filter(l => l.t == null).length;
    if (n) { setTab('sync'); return `아직 ${n}줄의 싱크가 남았어요.`; }
    if (s.lines.some((l, i) => i > 0 && l.t < s.lines[i - 1].t)) { setTab('sync'); return '시간 순서가 뒤바뀐 줄이 있어요 (노란색 시간).'; }
    return '';
  }
  async function save(thenPlay) {
    const err = validate(); saveMsg.textContent = err; if (err) return;
    const btns = [$('#save'), $('#savePlay')]; btns.forEach(b => b.disabled = true);
    saveMsg.textContent = '저장하는 중…';
    try {
      const s = ed.song;
      const payload = { id: s.id, youtube_id: s.youtube_id, title: s.title.trim(), artist: s.artist.trim(), author: (s.author || '').trim() || '익명',
        lines: s.lines.map(l => ({ t: round2(l.t), e: round2(l.e), text: l.text })) };
      const newId = await Store.save(payload);
      const wasNew = !s.id; s.id = newId; ed.dirty = false;
      if (wasNew) ls.del('gb.draft');
      if (thenPlay) { location.hash = '#/play/' + newId; return; }
      if (wasNew) history.replaceState(null, '', '#/edit/' + newId);
      saveMsg.textContent = sb ? '저장했어요. 대시보드에 공유됐어요.' : '저장했어요. (이 기기에만 저장됨)';
      toast('저장했어요');
    } catch (e) { console.error(e); saveMsg.textContent = e.message || '저장하지 못했어요.'; }
    finally { btns.forEach(b => b.disabled = false); }
  }
  $('#save').addEventListener('click', () => save(false));
  $('#savePlay').addEventListener('click', () => save(true));
  $('#exportLrc').addEventListener('click', () => download(`${ed.song.title || 'lyrics'}.lrc`, toLRC(ed.song)));
  if ($('#del')) {
    $('#del').addEventListener('click', () => $('#confirm').hidden = false);
    $('#delNo').addEventListener('click', () => $('#confirm').hidden = true);
    $('#delYes').addEventListener('click', async () => {
      try { await Store.remove(ed.song.id); ed.dirty = false; toast('삭제했어요'); location.hash = '#/'; }
      catch (e) { saveMsg.textContent = e.message; }
    });
  }

  setTab(ed.tab);
}

/* ================= 부르기 (노래방 화면) ================= */
async function viewPlay(id) {
  const song = await Store.get(id);
  const L = (song.lines || []).filter(l => l.t != null).sort((a, b) => a.t - b.t);
  const ends = L.map((_, i) => endOf(L, i));
  if (!L.length) throw new Error('아직 싱크된 줄이 없는 곡이에요.');
  document.body.classList.add('playing');
  let delay = ls.get('gb.delay', 0);

  view.innerHTML = `
    <div class="play">
      <div class="play-top">
        <a class="btn btn-sm btn-ghost" href="#/">← 목록</a>
        <div class="play-title"><span class="mono">${songNo(song.id)}</span>${esc(song.title)} <span class="dim">· ${esc(song.artist || '')}</span></div>
        <div class="offset" role="group" aria-label="블루투스 지연 보정" title="소리가 가사보다 늦게 들리면 + 를 눌러주세요">
          <span class="dim" style="font-size:13px">소리 지연</span>
          <button type="button" class="btn btn-sm" id="dM" aria-label="지연 0.1초 줄이기">−</button>
          <span class="mono" id="dV"></span>
          <button type="button" class="btn btn-sm" id="dP" aria-label="지연 0.1초 늘리기">+</button>
        </div>
        <button type="button" class="btn btn-sm" id="vidT">영상 작게</button>
        <button type="button" class="btn btn-sm" id="share">링크 복사</button>
        <button type="button" class="btn btn-sm" id="fs">전체화면</button>
        ${canEdit(song) ? `<a class="btn btn-sm btn-ghost" href="#/edit/${esc(song.id)}">편집</a>` : ''}
      </div>
      <div class="play-video" id="pv"><div id="yt"></div></div>
      <p class="hint err" id="perr" role="alert" style="text-align:center"></p>
      <div class="stage" id="stage">
        <div class="dots" id="dots" hidden><i></i><i></i><i></i><i></i></div>
        <div class="slot upper" id="s0"><span class="lyr"><span class="base"></span></span></div>
        <div class="slot lower" id="s1"><span class="lyr"><span class="base"></span></span></div>
        <div class="overlay" id="tc">
          <div class="tc-no">No. ${songNo(song.id)}</div>
          <div class="tc-title">${esc(song.title)}</div>
          <div class="tc-artist">${esc(song.artist || '')}</div>
          <div class="tc-by">가사 싱크 · ${esc(song.author || '익명')}</div>
          <div class="tc-hint" id="tcHint">영상의 ▶ 를 눌러 시작하세요 · 스페이스바로도 재생돼요</div>
        </div>
        <div class="overlay" id="inter" hidden><div class="interlude">간 주 중</div></div>
        <div class="overlay interact" id="endc" hidden>
          <div class="tc-title">수고하셨습니다</div>
          <div class="end-actions"><button type="button" class="btn btn-wipe" id="again">다시 부르기</button><a class="btn" href="#/">다른 곡 고르기</a></div>
        </div>
      </div>
    </div>`;

  const showDelay = () => $('#dV').textContent = `${delay.toFixed(1)}초`;
  showDelay();
  const setDelay = d => { delay = round2(clamp(d, -2, 3)); ls.set('gb.delay', delay); showDelay(); };
  $('#dM').addEventListener('click', () => setDelay(delay - 0.1));
  $('#dP').addEventListener('click', () => setDelay(delay + 0.1));
  $('#vidT').addEventListener('click', e => { const s = $('#pv').classList.toggle('small'); e.currentTarget.textContent = s ? '영상 크게' : '영상 작게'; requestAnimationFrame(fitAll); });
  $('#share').addEventListener('click', () => copyText(location.href));
  const toggleFs = () => {
    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => toast('이 브라우저에서는 전체화면을 쓸 수 없어요'));
  };
  $('#fs').addEventListener('click', toggleFs);

  let player = null, clock = null, bumped = false, wake = null;
  const perr = $('#perr');
  try {
    player = await createPlayer('yt', song.youtube_id, {
      onError: c => perr.textContent = ytErrorText(c),
      onState: st => {
        if (st === 1) {
          if (!bumped) { bumped = true; Store.bump(song.id); }
          if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(w => { wake = w; w.addEventListener('release', () => wake = null); }).catch(() => {});
        }
      }
    });
    clock = new Clock(player);
  } catch (e) { perr.textContent = e.message; }
  onCleanup(() => { try { player && player.destroy(); } catch {} try { wake && wake.release(); } catch {} });
  $('#again').addEventListener('click', () => { if (player) { player.seekTo(0, true); player.playVideo(); } });
  listen(document, 'keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (e.code === 'Space' && player) { e.preventDefault(); player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  });

  /* 두 줄 노래방 표시: i번 줄은 i%2 자리(위/아래)에 표시 */
  const slots = [$('#s0'), $('#s1')].map(el => ({ el, base: el.querySelector('.base'), idx: -2 }));
  function fit(slot) {
    slot.el.style.fontSize = '';
    const lyr = slot.el.firstElementChild, max = slot.el.clientWidth - parseFloat(getComputedStyle(slot.el).paddingLeft) - parseFloat(getComputedStyle(slot.el).paddingRight);
    const w = lyr.scrollWidth;
    if (w > max && w > 0) slot.el.style.fontSize = (parseFloat(getComputedStyle(slot.el).fontSize) * max / w * 0.97) + 'px';
  }
  function fitAll() { slots.forEach(fit); }
  listen(window, 'resize', fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  function setSlot(slot, i) {
    if (slot.idx === i) return;
    slot.idx = i;
    const text = i >= 0 && i < L.length ? L[i].text : '';
    slot.base.textContent = text;
    fit(slot);
  }
  const lastEnd = ends[ends.length - 1];
  const tc = $('#tc'), inter = $('#inter'), endc = $('#endc'), dots = $('#dots'), dotEls = $$('#dots i');
  let started = false;

  loop(() => {
    const t = (clock ? clock.now() : 0) - delay;
    if (!started && clock && t > 0.05) { started = true; $('#tcHint').hidden = true; }
    let active = -1, next = -1;
    for (let i = 0; i < L.length; i++) {
      if (L[i].t <= t && t < ends[i]) active = i;
      if (next < 0 && L[i].t > t) next = i;
    }
    const pivot = active >= 0 ? active : next;
    const gapToNext = next >= 0 ? L[next].t - t : Infinity;
    const afterGap = next === 0 || (next > 0 && L[next].t - ends[next - 1] >= 4);

    const showTitle = active < 0 && next === 0 && gapToNext > 4;
    const showInter = active < 0 && next > 0 && gapToNext > 4;
    const showEnd = active < 0 && next < 0 && t > lastEnd + 1;
    tc.hidden = !showTitle; inter.hidden = !showInter; endc.hidden = !showEnd;

    const showDots = active < 0 && next >= 0 && afterGap && gapToNext <= 4 && gapToNext > 0;
    dots.hidden = !showDots;
    if (showDots) { const n = Math.ceil(gapToNext); dotEls.forEach((d, k) => d.classList.toggle('off', k >= n)); }

    if (showTitle || showInter || showEnd || pivot < 0) { setSlot(slots[0], -1); setSlot(slots[1], -1); return; }
    const pair = [pivot, pivot + 1 < L.length ? pivot + 1 : -1];
    for (const i of pair) {
      if (i < 0) continue;
      const slot = slots[i % 2];
      setSlot(slot, i);
    }
    if (pair[1] < 0) setSlot(slots[(pivot + 1) % 2], -1);
  });
}

/* ---------- 시작 ---------- */
{
  const mb = $('#modeBar');
  if (!/^https?:$/.test(location.protocol)) {
    mb.hidden = false;
    mb.textContent = '파일을 직접 열어서 유튜브 영상이 재생되지 않아요. 사이트를 인터넷에 올린 주소(https://…)로 열어주세요. README 참고.';
  } else if (!sb) {
    mb.hidden = false;
    mb.textContent = '로컬 모드: 지금은 이 기기에만 저장돼요. 다른 사람과 공유하려면 공유 서버(Supabase)를 연결하세요. README 참고.';
  }
}
window.addEventListener('hashchange', route);
route();
</script>
